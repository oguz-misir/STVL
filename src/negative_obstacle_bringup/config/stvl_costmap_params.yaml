# STVL tabanlı local costmap parametreleri
# /semantic_drop_points topic'ini ikinci observation source olarak kullanır.
#
# Nav2 local_costmap içinde bu dosya plugins listesine eklenir.

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05

      # Plugin olarak STVL kullan
      plugins: ["stvl_layer"]

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 15.0             # saniye — drop noktası ne kadar süre kalır
        decay_model: 0                # 0=linear, 1=exponential
        voxel_size: 0.05              # metre
        track_unknown_space: true
        unknown_threshold: 15
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1         # 1=max
        origin_z: 0.0
        publish_voxel_map: false      # RViz/CPU yükü — yalnızca voxel debug için true yap
        transform_tolerance: 0.5

        # Birinci kaynak: RGB-D depth kamerası (standart)
        observation_sources: depth_camera drop_edges

        depth_camera:
          data_type: PointCloud2
          topic: /camera/depth/points
          marking: true
          clearing: true
          obstacle_range: 3.5
          raytrace_range: 4.0
          min_obstacle_height: -0.1
          max_obstacle_height: 2.0
          expected_update_rate: 0.0

        # İkinci kaynak: SemanticDropPublisher çıktısı
        drop_edges:
          data_type: PointCloud2
          topic: /semantic_drop_points
          marking: true
          clearing: false             # drop noktaları sadece işaretler, temizlemez
          obstacle_range: 3.5
          raytrace_range: 0.0
          min_obstacle_height: -0.5   # zemin altındaki düşme bölgelerini yakala
          max_obstacle_height: 0.3
          expected_update_rate: 0.0
